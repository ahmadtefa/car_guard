name: Validate Flutter

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Keep only the newest build for a branch; rapid commits must not leave
# several expensive Flutter builds queued or running at once.
concurrency:
  group: car-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
