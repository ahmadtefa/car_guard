name: solar_manager
description: "Solar Manager - نظام إدارة محطات الطاقة الشمسية"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Database - SQLite with type-safe queries (Offline First)
  drift: ^2.21.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.24

  # State Management - Provider (simple, stable, minimal)
  provider: ^6.1.2

  # Unique IDs
  uuid: ^4.5.1

  # Date formatting
  intl: ^0.19.0

  # JSON serialization
  json_annotation: ^4.9.0

  # Path utilities
  path: ^1.9.0
  path_provider: ^2.1.4

  # Decimal arithmetic (avoids floating point errors in money)
  decimal: ^2.3.3

  # File picker (for import)
  file_picker: ^8.1.4

  # Share files
  share_plus: ^10.0.3

  # Archive/ZIP for export
  archive: ^3.6.1

  # Equatable for value objects
  equatable: ^2.0.7

  # Google Fonts - Cairo Arabic font
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation for Drift ORM
  drift_dev: ^2.21.0
  build_runner: ^2.4.13

  # JSON code generation
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

