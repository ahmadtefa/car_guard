# Sized down for low-RAM machines (this project is also built on a
# 4 GB laptop): 8G/4G heaps were thrashing Gradle/Kotlin daemons into
# swap and making the first build look frozen for ~forever.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.caching=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
