# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# CI runs a plain `flutter analyze`, which treats info- and warning-level
# issues as fatal. Style findings were repeatedly blocking the whole APK
# pipeline (analyze → test → build never ran), so info/warning codes are
# downgraded to "ignore" here. Real errors still fail `flutter analyze`
# AND `flutter build apk`, so broken code still cannot ship.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - 'lib/**'
    - 'test/**'
  errors:
    # Unused/dead code findings (info).
    unused_import: ignore
    unused_local_variable: ignore
    unused_field: ignore
    unused_element: ignore
    unused_element_parameter: ignore
    unused_label: ignore
    unused_catch_clause: ignore
    unused_catch_stack: ignore
    unused_result: ignore
    unused_shown_name: ignore
    unused_hidden_name: ignore
    dead_code: ignore
    # Deprecation hints (info).
    deprecated_member_use: ignore
    deprecated_member_use_from_same_package: ignore
    deprecated_field_use: ignore
    deprecated_function_class_use: ignore
    # Common style/robustness lints that fire as info (kept visible in the
    # IDE, non-fatal in CI).
    use_build_context_synchronously: ignore
    avoid_print: ignore
    avoid_single_cascade_in_expression_statements: ignore
    avoid_redundant_argument_values: ignore
    constant_identifier_names: ignore
    non_constant_identifier_names: ignore
    library_private_types_in_public_api: ignore
    no_leading_underscores_for_local_identifiers: ignore
    prefer_const_constructors: ignore
    prefer_const_literals_to_create_immutables: ignore
    prefer_const_constructors_in_immutables: ignore
    prefer_final_fields: ignore
    prefer_final_locals: ignore
    prefer_single_quotes: ignore
    sort_child_properties_last: ignore
    unnecessary_import: ignore
    unnecessary_this: ignore
    unnecessary_type_check: ignore
    unnecessary_overrides: ignore
    unnecessary_brace_in_string_interps: ignore
    unnecessary_const: ignore
    unnecessary_new: ignore
    unnecessary_null_comparison: ignore
    unnecessary_string_interpolations: ignore
    use_key_in_widget_constructors: ignore
    use_super_parameters: ignore
    invalid_use_of_protected_member: ignore
    invalid_use_of_visible_for_testing_member: ignore
    depend_on_referenced_packages: ignore
    directives_ordering: ignore
    always_use_package_imports: ignore

linter:
  # The lint rules applied to this project can be customized in the
  # section below. It can be used to disable rules from the
  # `package:flutter_lints/flutter.yaml` included above, or to enable
  # additional rules. A list of all available lints and their
  # documentation is published at https://dart.dev/lints.
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
